<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>The science behind Rikudo³</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<style>
  :root {
    --bg: #0d0f14; --text: #e8e6e1; --muted: #8d93a1; --line: rgba(255,255,255,0.09);
    --accent: #f2c14e; --teal: #5fd4e0; --bad: #ff6b6b;
    --grid: rgba(255,255,255,0.13); --axis: rgba(255,255,255,0.38);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg) radial-gradient(ellipse 120% 900px at 50% 0%, #1a1e29 0%, var(--bg) 70%) no-repeat; color: var(--text);
    font: 16.5px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .top { position: sticky; top: 0; z-index: 2; background: rgba(13,15,20,0.88); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .top .in { max-width: 820px; margin: 0 auto; padding: 10px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top .brand { font-weight: 700; letter-spacing: 0.02em; }
  .top .brand sup { color: var(--accent); }
  .top a { color: var(--text); text-decoration: none; font-size: 14px; background: rgba(255,255,255,0.06); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; }
  .top a:hover { background: rgba(255,255,255,0.12); border-color: rgba(242,193,78,0.5); }
  main { max-width: 820px; margin: 0 auto; padding: 28px 22px 80px; }
  h1 { font-size: 34px; line-height: 1.2; margin: 10px 0 6px; letter-spacing: 0.01em; }
  h1 sup, h2 sup { color: var(--accent); }
  .byline { color: var(--muted); font-size: 14px; margin: 0 0 26px; }
  h2 { font-size: 23px; margin: 44px 0 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  p { margin: 12px 0; }
  strong { color: #fff; font-weight: 650; }
  ol, ul { padding-left: 24px; }
  li { margin: 6px 0; }
  li p { margin: 4px 0; }
  .math { margin: 14px 0; padding: 12px 16px; background: rgba(255,255,255,0.035); border: 1px solid var(--line); border-radius: 10px;
    overflow-x: auto; text-align: center; font-size: 17px; }
  .tbl { overflow-x: auto; margin: 16px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: 0.02em; border-bottom-color: rgba(242,193,78,0.35); }
  tbody tr:hover td { background: rgba(255,255,255,0.025); }
  figure { margin: 22px 0; padding: 14px 12px 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 14px; }
  figure svg { display: block; width: 100%; height: auto; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  figcaption { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 6px; }
  .pagefoot { color: var(--muted); font-size: 13px; margin: -40px 0 60px; text-align: center; }
  .pagefoot a { color: var(--accent); }
  .math.raw { font-family: ui-monospace, monospace; font-size: 13px; }
  @media (max-width: 600px) { h1 { font-size: 27px; } h2 { font-size: 20px; } body { font-size: 15.5px; } }
</style>
</head>
<body>
<div class="top"><div class="in">
  <span class="brand">Rikudo<sup>³</sup></span>
  <a href="index.html">← Back to the game</a>
</div></div>
<main id="sciMain"></main>
<footer class="pagefoot"><a href="index.html">← Back to the game</a></footer>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="science-content.js"></script>
<script>
// back link: close this tab if the game opened it, otherwise navigate to the game
document.querySelectorAll('a[href="index.html"]').forEach((a) => a.addEventListener('click', (ev) => {
  if (window.opener && !window.opener.closed) { ev.preventDefault(); window.opener.focus(); window.close(); }
}));
RIKUDO_SCIENCE.mount(document.getElementById('sciMain'));
</script>
</body>
</html>
